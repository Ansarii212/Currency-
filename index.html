<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>أسعار العملات والذهب مقابل الجنيه</title>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #f4f4f4;
      text-align: center;
      direction: rtl;
    }
    h1 {
      margin-top: 20px;
      color: #333;
    }
    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 80%;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px;
      border: 1px solid #ddd;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    #lastUpdate {
      margin-top: 10px;
      color: #777;
    }
  </style>
</head>
<body>

<h1>أسعار العملات والذهب مقابل الجنيه المصري</h1>
<div id="lastUpdate">جاري التحديث...</div>
<table>
  <thead>
    <tr>
      <th>العملة</th>
      <th>السعر بالجنيه</th>
    </tr>
  </thead>
  <tbody id="ratesTable">
    <!-- سيتم ملء البيانات هنا -->
  </tbody>
</table>

<script>
  async function fetchRates() {
    const currencies = ["USD", "EUR", "SAR", "AED", "GBP", "JPY"];
    const tableBody = document.getElementById('ratesTable');

    // جلب سعر الجنيه مقابل الدولار والعملات الأخرى
    const response = await fetch('https://api.exchangerate.host/latest?base=USD');
    const data = await response.json();

    const usdToEgp = data.rates.EGP;

    tableBody.innerHTML = "";

    currencies.forEach(currency => {
      if (currency === "USD") {
        tableBody.innerHTML += `
          <tr>
            <td>الدولار الأمريكي</td>
            <td>${usdToEgp.toFixed(2)}</td>
          </tr>
        `;
      } else {
        const rateToCurrency = data.rates[currency];
        const egpRate = usdToEgp / rateToCurrency;
        tableBody.innerHTML += `
          <tr>
            <td>${currency}</td>
            <td>${egpRate.toFixed(2)}</td>
          </tr>
        `;
      }
    });

    // حساب سعر الذهب التقريبي
    const goldPriceUsdPerOunce = 2300; // سعر تقريبي
    const goldPriceGramEgp = (goldPriceUsdPerOunce / 31.1) * usdToEgp;

    tableBody.innerHTML += `
      <tr>
        <td>الذهب (عيار 24) / جرام</td>
        <td>${goldPriceGramEgp.toFixed(2)}</td>
      </tr>
    `;

    document.getElementById('lastUpdate').innerText =
      "آخر تحديث: " + new Date().toLocaleTimeString('ar-EG');
  }

  fetchRates();
  setInterval(fetchRates, 60000); // تحديث كل دقيقة
</script>

</body>
</html>
